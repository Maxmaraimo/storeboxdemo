{% extends 'base.html' %}

{% block title %}Магазин не найден — StoreBox{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-900 text-white flex items-center justify-center p-4">
    <div class="max-w-md w-full text-center space-y-6 bg-slate-800/80 backdrop-blur-xl p-8 rounded-3xl border border-slate-700/80 shadow-2xl">
        <div class="w-16 h-16 rounded-2xl bg-rose-500/10 text-rose-400 flex items-center justify-center mx-auto border border-rose-500/20">
            <i data-lucide="store" class="w-8 h-8"></i>
        </div>

        <div>
            <h1 class="text-2xl font-black">Магазин не найден</h1>
            <p class="text-xs text-slate-400 mt-2">
                Поддомен <code class="text-emerald-400 font-mono">{{ subdomain }}</code> не зарегистрирован на платформе StoreBox или временно отключен.
            </p>
        </div>

        <div class="pt-4 border-t border-slate-700 flex flex-col gap-3">
            <a href="/" class="py-3 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs transition-colors">
                Перейти на главную платформы
            </a>
            <a href="/register/" class="py-3 px-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs transition-colors">
                Зарегистрировать этот поддомен
            </a>
        </div>
    </div>
</div>
{% endblock %}
